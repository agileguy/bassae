name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
