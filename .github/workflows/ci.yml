name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version results are measured on locally, so CI checks the same runtime (ISC-31).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      # Ubuntu 24.04 blocks unprivileged user namespaces, which bwrap needs for the renderer sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          BASSAE_REQUIRE_SANDBOX: "1"
